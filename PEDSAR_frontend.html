function filterCatalog(){if(!$('#catalog-results'))return;['category','level','mode','duration'].forEach(n=>$('#f_'+n).onchange=filterCatalog);const q=$('#q').value.toLocaleLowerCase(),cat=$('#f_category').value,l=$('#f_level').value,m=$('#f_mode').value,d=$('#f_duration').value,max=Number($('#f_max').value||1e9);let list=db.courses.filter(c=>c.status==='Publicado'&&db.categoryDetails?.[c.category]?.status!=='Inactiva'&&[c.title,c.instructor,c.category,c.description].join(' ').toLowerCase().includes(q)&&(cat==='Todas'||c.category===cat)&&(l==='Todos'||c.level===l)&&(m==='Todas'||c.mode===m)&&c.price<=max&&(d==='Todas'||(d==='Hasta 40 horas'?c.hours<=40:c.hours>40)));list.sort((a,b)=>$('#sort').value==='price'?a.price-b.price:$('#sort').value==='az'?a.title.localeCompare(b.title):b.enrolled-a.enrolled);$('#catalog-count').textContent=list.length+' cursos disponibles';$('#catalog-results').innerHTML=list.map(c=>card(c)).join('')||empty('No encontramos cursos','Cambia la búsqueda o limpia los filtros.')}

function detail(){const c=course(arg),enrolled=c.id in db.progress;return `<a class="btn ghost mb-4" href="#catalogo">← Volver al catálogo</a><section class="detail-hero"><span class="pill">${esc(c.category)} · ${esc(c.level)}</span><h1>${esc(c.title)}</h1><p>${esc(c.description)}</p><div class="course-meta"><span>${icon('user')}${esc(c.instructor)}</span><span>${icon('clock')}${c.hours} horas</span><span>${icon('globe')}${esc(c.mode)}</span><span>★ ${rating(c.id)} · Valoración ilustrativa y reseñas locales</span></div></section><div class="split"><div class="card pad"><h2>Lo que vas a aprender</h2><div class="cols2 mt-6"><p class="text-sm">✓ Aplicar los fundamentos en ejercicios prácticos.</p><p class="text-sm">✓ Desarrollar un proyecto guiado.</p><p class="text-sm">✓ Resolver problemas de tu entorno profesional.</p><p class="text-sm">✓ Evaluar y comunicar tus resultados.</p></div><h2 class="mt-6">Contenido del curso</h2><div class="curriculum">${lessonNames(c).map((n,i)=>`<details ${i===0?'open':''}><summary>Módulo ${i+1} · ${esc(n)}</summary><div class="lesson"><span>Lección, material y actividad práctica</span><span>${Math.round(c.hours/4)} h</span></div></details>`).join('')}</div><h2 class="mt-6">Requisitos previos</h2><p class="muted text-sm mt-4">${esc(c.requirements)}</p><h2 class="mt-6">Conoce a tu instructor</h2><div class="flex items-center gap-3 mt-4"><span class="avatar">${esc(c.instructor[0])}</span><div><h3>${esc(c.instructor)}</h3><p class="muted text-sm">Especialista en ${esc(c.category)} · Perfil de demostración.</p></div></div><h2 class="mt-6">Reseñas de estudiantes</h2>${db.reviews.filter(r=>r.course===c.id).map(r=>`<div class="list-item"><div><strong>${'★'.repeat(Number(r.stars))}</strong><p>${esc(r.text)}</p></div></div>`).join('')||'<p class="muted text-sm mt-4">Aún no hay reseñas locales. Puedes escribir una al completar el curso.</p>'}</div><aside class="card pad" style="align-self:start"><span class="small muted">INVERSIÓN EN TU FUTURO</sp el class="check mt-4"><input type="checkbox" required name="terms">Acepto los términos y la política de privacidad.</label><button type="button" class="btn ghost tiny" onclick="privacy()">Leer privacidad y términos</button></div><aside class="card pad" style="align-self:start"><h2>Resumen de inscripción</h2><div class="course-cover ${c.color} mt-6" style="border-radius:9px"><b>${esc(c.tag)}</b>${icon('book')}</div><h3 class="mt-4">${esc(c.title)}</h3><p class="small muted mt-4">${c.hours} horas · ${esc(c.mode)}</p><div class="field mt-6"><label for="coupon">¿Tienes un cupón?</label><div class="flex gap-2"><input id="coupon" placeholder="PEDSAR10"><button type="button" class="btn secondary tiny" onclick="applyCoupon(${c.id})">Aplicar</button></div><small id="couponResult">Prueba el código PEDSAR10.</small></div><div class="settings-row"><span>Subtotal</span><strong>${money(c.price)}</strong></div><div class="settings-row"><span>Descuento</span><strong id="discount">− S/ 0.00</strong></div><div class="settings-row"><strong>Total</strong><strong id="total">${money(c.price)}</strong></div><button class="btn w-full mt-6" type="submit">Simular inscripción ${icon('arrow')}</button><p class="small muted mt-4 text-center">Ningún importe será cobrado.</p></aside></div></form>`}
document.addEventListener('change',e=>{if(e.target.id==='f_receipt'){const active=e.target.value==='Factura';$('#fiscal').classList.toggle('hidden',!active);['ruc','business'].forEach(n=>$('#f_'+n).required=active)}});
function applyCoupon(id){const c=db.coupons.find(x=>x.code.toUpperCase()===$('#coupon').value.trim().toUpperCase()&&x.until>=new Date().toISOString().slice(0,10)&&Number(x.uses)>Number(x.used||0)&&(x.course==='Todos'||x.course===course(id).title));discount=c?Number(c.discount):0;activeCoupon=c||null;$('#couponResult').textContent=c?`Cupón aplicado: ${discount}% de descuento.`:'El cupón no es válido o ha vencido.';$('#discount').textContent='− '+money(course(id).price*discount/100);$('#total').textContent=money(course(id).price*(1-discount/100))}
function submitCheckout(e,id){e.preventDefault();const f=new FormData(e.target),c=course(id);if(id in db.progress){toast('Ya tienes acceso a este curso.');return}if(c.enrolled>=c.capacity){toast('Ya no quedan cupos disponibles.');return}if(db.payments.some(p=>p.course===id&&p.status==='Pendiente')){toast('Ya tienes una inscripción pendiente para este curso.');return}const pending=['Transferencia','Efectivo en oficina'].includes(f.get('method'));db.profile={...db.profile,name:f.get('name'),last:f.get('last'),email:f.get('email'),phone:f.get('phone')};db.payments.unshift({id:Date.now(),course:id,date:new Date().toISOString().slice(0,10),amount:c.price*(1-discount/100),method:f.get('method'),status:pending?'Pendiente':'Pagado',receipt:f.get('receipt'),ruc:f.get('ruc'),business:f.get('business')});c.enrolled++;if(activeCoupon)activeCoupon.used=Number(activeCoupon.used||0)+1;if(!pending){db.progress[id]=0;db.done[id]=[]}role='estudiante';log('Inscripción',c.title);go('pagos');openModal(pending?'Inscripción pendiente':'¡Tu inscripción está lista!',`<div class="text-center">${icon(pending?'clock':'check')}<h3 class="mt-4">${esc(c.title)}</h3><p class="muted">${pending?'Tu matrícula queda pendiente de validar el pago. Puedes revisarla en tu historial.':'El curso ya aparece en tu campus. Puedes empezar a explorar sus materiales.'}</p><div class="hint">Confirmación de demostración. No se procesó dinero ni se envió correo.</div>${button('Continuar','closeModal()')}</div>`)}

function authSubmit(e,type){e.preventDefault();const f=new FormData(e.target);if(type==='register'){db.profile={...db.profile,name:f.get('name'),last:f.get('last'),email:f.get('email')};db.terms={version:'demo-1',accepted:new Date().toISOString()};save();openModal('Verifica tu correo',`<p class="muted text-sm">Introduce el código de 6 dígitos para continuar. En este prototipo el código es <strong>123456</strong>; no se ha enviado un correo.</p><form onsubmit="verifyAccount(event)">${field('Código de verificación','otp','','text','required pattern="[0-9]{6}" maxlength="6" inputmode="numeric"')}<p id="otpError" class="error"></p><button class="btn w-full">Verificar cuenta</button></form>${button('Reenviar código',"toast('Código de demostración: 123456. No se envió un correo.')",'ghost mt-4')}`)}else if(type==='recover'){openModal('Restablecer contraseña',`<div class="hint">Vista del enlace de recuperación. En producción el enlace expirará en 24 horas y se enviará por correo.</div><form onsubmit="event.preventDefault();closeModal();toast('Validación completada en la demostración. El acceso de prueba conserva Pedsar2026.');go('acceso')">${field('Nueva contraseña','newpass','','password','required minlength="8" pattern="(?=.*[A-Za-z])(?=.*[0-9]).{8,}" title="Mínimo 8 caracteres con letras y números"')}<button class="btn w-full">Validar nueva contraseña</button></form>`)}else{if(!['javier@ejemplo.com',db.profile.email].includes(f.get('email'))||f.get('password')!=='Pedsar2026'){$('#authError').textContent='Correo o contraseña de demostración incorrectos.';return}role='estudiante';log('Inicio de sesión','Acceso de demostración');go('inicio')}}
function verifyAccount(e){e.preventDefault();if(new FormData(e.target).get('otp')!=='123456'){$('#otpError').textContent='El código no es correcto. Prueba 123456.';return}role='estudiante';log('Registro','Cuenta verificada en modo demostración');closeModal();go('inicio');toast('Cuenta de demostración activada.')}
function logout(){log('Cierre de sesión','Sesión de demostración cerrada');role='publico';save();go('portada')}
function classroom(){const c=course(arg);if(!(c.id in db.progress))return empty('Este curso requiere matrícula','Inscríbete desde el catálogo para acceder al aula.');const done=db.done[c.id]||[],names=lessonNames(c);lesson=Math.min(lesson,3);return heading(esc(c.title),'Tu espacio para aprender, practicar y avanzar.',link('Mis cursos','mis-cursos','secondary'))+`<div class="split" style="grid-template-columns:minmax(0,1fr) 310px"><section><div class="player" id="player"><span class="eyebrow">${esc(c.tag)} · LECCIÓN ${lesson+1}</span><h2>${esc(names[lesson])}</h2><code>${c.id===1?'const [progreso, setProgreso] = useState(0);':'Aprender → Practicar → Aplicar'}</code><p class="small">Vista previa de la lección. Carga un video local para probar el reproductor.</p><label class="btn lime mt-4" style="font-weight:600;cursor:pointer">${icon('play')} Cargar video de prueba<input type="file" accept="video/mp4,video/webm" hidden onchange="loadVideo(this.files[0],${c.id})"></label></div><div class="card pad mt-4"><div class="flex justify-between items-center gap-3 flex-wrap"><div><span class="small muted">MÓDULO ${lesson+1} DE 4</span><h2 class="mt-4">${esc(names[lesson])}</h2></div>${button(done.includes(lesson)?'Completada':'Marcar como completada',`completeLesson(${c.id},${lesson})`,done.includes(lesson)?'secondary':'','check')}</div><div class="tabs"><button class="selected" onclick="classTab('resumen',this,${c.id})">Resumen</button><button onclick="classTab('materiales',this,${c.id})">Materiales</button><button onclick="classTab('notas',this,${c.id})">Mis notas</button><button onclick="classTab('comentarios',this,${c.id})">Comentarios</button></div><div id="classTab">${classContent('resumen',c)}</div></div></section><aside><div class="card"><div class="pad"><h2>Contenido del curso</h2><div class="progress-label"><span>Tu progreso</span><strong>${progress(c)}%</strong></div><div class="progress"><i style="width:${progress(c)}%"></i></div></div><div class="lesson-nav">${names.map((n,i)=>`<button class="${i===lesson?'selected':''}" onclick="lesson=${i};render()">${icon(done.includes(i)?'check':'play')}<span>${i+1}. ${esc(n)}</span></button>`).join('')}</div><div class="pad">${link('Evaluación del curso','evaluaciones','secondary w-full','checklist')}</div></div><div class="card pad note-panel mt-6"><h3>¿Tienes una pregunta?</h3><p>Comparte tu consulta con el instructor y tus compañeros.</p>${link('Ir al foro del curso','comunidad','ghost','chat')}</div></aside></div>`}
function completeLesson(id,i){db.done[id]??=[];if(db.done[id].includes(i)){toast('Esta lección ya está completada.');return}if(!db.done[id].includes(i))db.done[id].push(i);db.progress[id]=db.done[id].length*25;log('Lección completada',course(id).title+' · '+(i+1));render();toast('Progreso actualizado. +50 puntos por lección completada.')}
function loadVideo(file,id){if(!file)return;if(!['video/mp4','video/webm'].includes(file.type)||file.size>50*1024*1024){toast('Selecciona un video MP4/WebM de hasta 50 MB.');return}const url=URL.createObjectURL(file);objectURLs.push(url);$('#player').innerHTML=`<video id="lessonVideo" controls playsinline aria-label="Video de la lección" onended="completeLesson(${id},${lesson})"></video>`;$('#lessonVideo').src=url;$('#lessonVideo').addEventListener('timeupdate',()=>{db.videoTime??={};db.videoTime[id+'-'+lesson]=Math.floor($('#lessonVideo').currentTime);save()})}
function classTab(tab,el,id){document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('selected'));el.classList.add('selected');$('#classTab').innerHTML=classContent(tab,course(id))}
function classContent(tab,c){if(tab==='resumen')return `<h3>De la teoría a la práctica</h3><p class="muted text-sm mt-4">Revisa los conceptos del módulo, explora el ejemplo y realiza la actividad. Al terminar, marca la lección para actualizar tu avance.</p><div class="hint">Actividad: identifica un problema cotidiano y describe cómo aplicarías lo aprendido en este módulo.</div>`;if(tab==='materiales')return `<div class="list-item"><span class="stat-icon">${icon('file')}</span><div style="flex:1"><h3>Guía de estudio · Módulo ${lesson+1}</h3><p>PDF de muestra · Disponible sin conexión después de descargar</p></div>${button('Descargar',`materialPDF(${c.id})`,'secondary tiny','download')}</div>${db.materials.filter(m=>Number(m.course)===c.id).map(m=>`<div class="list-item"><div><h3>${esc(m.title)}</h3><p>${esc(m.type)} · Módulo ${esc(m.module)}</p></div>${m.url?`<a class="btn secondary tiny" href="${esc(m.url)}" target="_blank" rel="noopener">Abrir</a>`:'<span class="pill gray">Archivo local de muestra</span>'}</div>`).join('')}`;if(tab==='notas')return `<form onsubmit="addNote(event,${c.id})">${textField('Tu nota personal','note','','required maxlength="1500"')}<button class="btn">Guardar nota y marcador</button></form>${db.notes.filter(n=>n.course===c.id).map(n=>`<div class="list-item"><div><span class="pill gray">Lección ${n.lesson+1} · ${Math.floor(n.time/60)}:${String(n.time%60).padStart(2,'0')}</span><p>${esc(n.text)}</p></div></div>`).join('')}`;return `<form onsubmit="addComment(event,${c.id})">${textField('Haz una pregunta sobre esta lección','comment','','required maxlength="1000"')}<button class="btn">Publicar comentario</button></form>${db.comments.filter(x=>x.course===c.id&&x.lesson===lesson).map(x=>`<div class="list-item"><span class="avatar">JC</span><div><h3 class="text-sm">${esc(x.author)}</h3><p>${esc(x.text)}</p>${x.reply?`<div class="hint">${esc(x.reply)}</div>`:''}<span class="pill ${x.resolved?'':'amber'}">${x.resolved?'Resuelto':'Por responder'}</span></div></div>`).join('')}`}
function addNote(e,id){e.preventDefault();db.notes.unshift({course:id,lesson,time:Math.floor($('#lessonVideo')?.currentTime||0),text:new FormData(e.target).get('note')});save();$('#classTab').innerHTML=classContent('notas',course(id));toast('Nota guardada en este navegador.')}
function addComment(e,id){e.preventDefault();db.comments.unshift({id:Date.now(),course:id,lesson,author:studentName(),text:new FormData(e.target).get('comment'),resolved:false});save();$('#classTab').innerHTML=classContent('comentarios',course(id));toast('Comentario añadido a la demostración.')}
function calendar(){return heading(role==='estudiante'?'Mi agenda':'Sesiones y horarios','Septiembre 2026 · Zona horaria de Lima, Perú',role==='instructor'?button('Nueva sesión','sessionForm()','','plus'):button('Conectar Google Calendar',"integrationInfo('Google Calendar')",'secondary','calendar'))+`<div class="split"><div class="card pad"><div class="flex justify-between items-center mb-4"><h2>Septiembre 2026</h2><span class="pill">Mes de demostración</span></div><div class="calendar-grid">${['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'].map(d=>`<div class="cal-label">${d}</div>`).join('')}<div></div>${Array.from({length:30},(_,i)=>`<div style="${i===21?'background:#f0f6e6':''}"><strong>${i+1}</strong>${db.sessions.filter(s=>s.date==='2026-09-'+String(i+1).padStart(2,'0')).map(s=>`<span class="cal-event">${s.start} ${esc(s.title)}</span>`).join('')}</div>`).join('')}${'<div></div>'.repeat(4)}</div></div><aside class="card pad"><h2>Próximas sesiones</h2>${db.sessions.map(s=>sessionItem(s)+`<div class="flex gap-2 mt-4">${button('Añadir .ics',`downloadICS(${s.id})`,'secondary tiny','calendar')}${role==='instructor'?button('Editar',`sessionForm(${s.id})`,'ghost tiny','edit'):button('Entrar a sesión',`joinSession(${s.id})`,'ghost tiny','play')}</div>`).join('')}</aside></div>`}
function sessionForm(id){const s=db.sessions.find(x=>x.id===id)||{};openModal(id?'Editar sesión':'Nueva sesión',`<form onsubmit="saveSession(event,${id||0})">${field('Nombre de la sesión','title',s.title||'','text','required')}${selectField('Curso','course',db.courses.map(c=>c.title),s.course?course(s.course).title:'')}<div class="cols2">${field('Fecha','date',s.date||'2026-09-25','date','required')}${selectField('Modalidad','mode',['Virtual','Presencial','Asíncrona'],s.mode)}${field('Hora de inicio','start',s.start||'19:00','time','required')}${field('Hora de fin','end',s.end||'21:00','time','required')}</div>${field('Enlace de videoconferencia (opcional)','link',s.link||'','url')}<p class="small muted">Puedes registrar un enlace o probar la vista de integración con Zoom.</p>${button('Conectar Zoom',"integrationInfo('Zoom')",'ghost')}<button class="btn w-full mt-4">Guardar sesión</button></form>`)}
function saveSession(e,id){e.preventDefault();const f=Object.fromEntries(new FormData(e.target));if(f.end<=f.start){toast('La hora de fin debe ser posterior al inicio.');return}if(f.link&&!safeUrl(f.link)){toast('Utiliza un enlace HTTPS válido.');return}f.course=db.courses.find(c=>c.title===f.course).id;f.id=id||Date.now();db.sessions=id?db.sessions.map(x=>x.id===id?f:x):[...db.sessions,f];log('Sesión guardada',f.title);closeModal();render()}
function joinSession(id){const s=db.sessions.find(x=>x.id===id);if(s.link&&safeUrl(s.link))window.open(s.link,'_blank','noopener');else openModal('Sesión virtual',`<h3>${esc(s.title)}</h3><p class="muted">El instructor aún no ha asociado un enlace de videoconferencia a esta sesión de muestra.</p><div class="hint">${esc(s.date)} · ${s.start}–${s.end} · Hora de Perú</div>`)}
function downloadICS(id){const s=db.sessions.find(x=>x.id===id),dt=t=>s.date.replaceAll('-','')+'T'+t.replace(':','')+'00';download('sesion-pedsar.ics',`BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//PEDSAR//Prototipo//ES\r\nBEGIN:VEVENT\r\nUID:pedsar-${id}@demo.local\r\nDTSTAMP:${new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,'')}\r\nDTSTART;TZID=America/Lima:${dt(s.start)}\r\nDTEND;TZID=America/Lima:${dt(s.end)}\r\nSUMMARY:${s.title.replace(/[\r\n,;]/g,' ')}\r\nDESCRIPTION:Sesion de demostracion PEDSAR\r\nEND:VEVENT\r\nEND:VCALENDAR`,'text/calendar')}
function assessments(){const staff=role!=='estudiante',a=db.assessment;return heading('Evaluaciones',staff?'Diseña actividades y revisa el aprendizaje de tus estudiantes.':'Pon en práctica lo aprendido y revisa tus resultados.',staff?button('Configurar evaluación','assessmentForm()','','plus'):'')+`<div class="${staff?'cols2':''}"><section class="card pad"><span class="pill ${db.attempts.length?'':'amber'}">${db.attempts.length?'Con intentos registrados':'Pendiente'}</span><h2 class="mt-4">${esc(a.title)}</h2><p class="muted text-sm mt-4">Desarrollo web con React · Evaluación de opción múltiple.</p><div class="course-meta"><span>${icon('clock')}${a.minutes} minutos</span><span>${a.questions.length} preguntas</span><span>${a.attempts} intentos permitidos</span></div><div class="hint">${db.attempts.length} de ${a.attempts} intentos utilizados · Nota mínima de demostración: 14/20.<br>Mejor nota: <strong>${db.attempts.length?Math.max(...db.attempts.map(x=>x.score)).toFixed(1):'—'}</strong></div>${staff?button('Vista previa','startExam(true)','secondary','play'):button(db.attempts.length?'Reintentar evaluación':'Comenzar evaluación','startExam(false)','','play')}<h3 class="mt-6">Historial de intentos</h3>${db.attempts.map((x,i)=>`<div class="settings-row"><span>Intento ${i+1} · ${esc(x.date)}</span><span class="pill ${x.score>=14?'':'amber'}">${x.score.toFixed(1)} / 20</span></div>`).join('')||'<p class="small muted mt-4">Todavía no has realizado la evaluación.</p>'}</section>${staff?`<section class="card pad"><div class="flex justify-between items-center"><h2>Banco de preguntas</h2>${button('Añadir','questionForm()','secondary tiny','plus')}</div>${db.questions.map(q=>`<div class="list-item"><div style="flex:1"><span class="pill gray">${esc(q.category)} · ${q.points} puntos</span><h3 class="mt-4 text-sm">${esc(q.text)}</h3></div>${button('Editar',`questionForm(${q.id})`,'ghost tiny')}</div>`).join('')}<div class="mt-6">${button('Importar preguntas','importQuestionsModal()','secondary','file')}</div></section>`:''}</div>`}
function startExam(preview=false){if(!preview&&db.attempts.length>=Number(db.assessment.attempts)){toast('Has alcanzado el límite de intentos.');return}examIds=db.assessment.questions;examStart=Date.now();openModal(db.assessment.title,`<div class="hint">Tiempo restante: <strong id="examClock">${db.assessment.minutes}:00</strong>${preview?' · Vista previa del instructor':''}</div><form id="exam" onsubmit="finishExam(event,${preview})">${examIds.map((id,i)=>{const q=db.questions.find(x=>x.id===id);return `<fieldset class="field" style="border:0;padding:0"><legend class="font-semibold text-sm mb-4">${i+1}. ${esc(q.text)} <span class="muted">(${q.points} puntos)</span></legend>${q.options.map((o,j)=>`<label class="payment-option"><input type="radio" name="q${id}" value="${j}"> ${esc(o)}</label>`).join('')}</fieldset>`}).join('')}<button class="btn w-full">Enviar evaluación</button></form>`);clearInterval(assessmentTimer);assessmentTimer=setInterval(()=>{const remain=Math.max(0,db.assessment.minutes*60-Math.floor((Date.now()-examStart)/1000));if(!$('#examClock')||!$('#modal').open){clearInterval(assessmentTimer);return}$('#examClock').textContent=Math.floor(remain/60)+':'+String(remain%60).padStart(2,'0');if(remain===0)finishExam({preventDefault(){},target:$('#exam')},preview)},1000)}
function finishExam(e,preview){e.preventDefault();clearInterval(assessmentTimer);const f=new FormData(e.target),qs=examIds.map(id=>db.questions.find(q=>q.id===id)),points=qs.reduce((s,q)=>s+Number(q.points),0),earned=qs.reduce((s,q)=>s+(f.get('q'+q.id)!==null&&Number(f.get('q'+q.id))===Number(q.correct)?Number(q.points):0),0),score=points?earned/points*20:0;if(!preview){db.attempts.push({score,date:new Date().toLocaleDateString('es-PE')});log('Evaluación enviada',score.toFixed(1)+'/20')}openModal('Resultado de la evaluación',`<div class="text-center"><span class="pill ${score>=14?'':'amber'}">${score>=14?'Aprobado':'Sigue practicando'}</span><p class="price mt-4">${score.toFixed(1)} / 20</p><p class="muted mt-4">${earned} de ${points} puntos. ${preview?'Vista previa: no afecta el historial.':'Conservamos tu calificación más alta.'}</p><div class="mt-6">${button('Volver a evaluaciones',"closeModal();render()")}</div></div>`)}
function assessmentForm(){const a=db.assessment;openModal('Configurar evaluación',`<form onsubmit="saveAssessment(event)">${field('Título','title',a.title,'text','required')}<div class="cols2">${field('Tiempo límite (minutos)','minutes',a.minutes,'number','required min="1" max="180"')}${field('Número de intentos','attempts',a.attempts,'number','required min="1" max="10"')}</div><h3>Selecciona preguntas del banco</h3>${db.questions.map(q=>`<label class="check mt-4"><input type="checkbox" name="question" value="${q.id}" ${a.questions.includes(q.id)?'checked':''}>${esc(q.text)}</label>`).join('')}<button class="btn w-full mt-6">Guardar evaluación</button></form>`)}
function saveAssessment(e){e.preventDefault();const f=new FormData(e.target),ids=f.getAll('question').map(Number);if(!ids.length){toast('Selecciona al menos una pregunta.');return}db.assessment={title:f.get('title'),minutes:Number(f.get('minutes')),attempts:Number(f.get('attempts')),questions:ids};save();closeModal();render();toast('Evaluación guardada.')}
function questionForm(id){const q=db.questions.find(x=>x.id===id)||{options:['','',''],correct:0,points:10,category:'React'};openModal('Pregunta de opción múltiple',`<form onsubmit="saveQuestion(event,${id||0})">${textField('Enunciado','text',q.text||'','required')}${q.options.map((o,i)=>field('Opción '+(i+1),'o'+i,o,'text','required')).join('')}<div class="cols2">${selectField('Respuesta correcta','correct',['Opción 1','Opción 2','Opción 3'],'Opción '+(q.correct+1))}${field('Puntaje','points',q.points,'number','min="1" max="100" required')}</div>${field('Categoría','category',q.category,'text','required')}<button class="btn w-full">Guardar pregunta</button></form>`)}
function saveQuestion(e,id){e.preventDefault();const f=new FormData(e.target),q={id:id||Date.now(),text:f.get('text'),options:[f.get('o0'),f.get('o1'),f.get('o2')],correct:Number(f.get('correct').slice(-1))-1,points:Number(f.get('points')),category:f.get('category')};db.questions=id?db.questions.map(x=>x.id===id?q:x):[...db.questions,q];save();closeModal();render()}
function certificates(){const list=db.courses.filter(c=>progress(c)===100),admin=role==='administrador';return heading(admin?'Certificados digitales':'Mis certificados',admin?'Consulta y exporta las acreditaciones emitidas.':'Cada certificado representa una nueva habilidad.',link('Verificación pública','verificar','secondary','shield'))+`${admin?`<div class="toolbar"><input placeholder="Filtrar por curso o instructor" aria-label="Filtrar certificados" oninput="filterRows(this.value)"><input aria-label="Fecha de emisión" type="date" style="flex:0 1 180px" onchange="filterCertificateDate(this.value)">${button('Excel (.xlsx)','certificateXLSX()','secondary','download')}${button('Exportar ZIP','certificateZIP()','secondary','folder')}</div>`:''}<div class="cols2">${list.map(c=>`<article class="card pad filter-row" data-search="${esc(c.title+' '+c.instructor)}" data-date="2026-09-15"><div class="flex items-center justify-between"><span class="stat-icon">${icon('award')}</span><span class="pill">Disponible</span></div><h2 class="mt-6">${esc(c.title)}</h2><p class="small muted mt-4">${esc(studentName())} · ${c.hours} horas</p><p class="small muted mt-4">Emitido: 15 sep 2026 · Código DEMO-PED-2026-${String(c.id).padStart(4,'0')}</p><div class="flex gap-2 flex-wrap mt-6">${button('Ver certificado',`showCertificate(${c.id})`,'secondary','award')}${button('Descargar PDF',`certificatePDF(${c.id})`,'','download')}${button('Compartir',`shareAchievement(${c.id})`,'ghost')}</div>${role==='estudiante'?button('Calificar este curso',`reviewForm(${c.id})`,'ghost mt-4','star'):''}</article>`).join('')||empty('Aún no tienes certificados','Completa las lecciones de un curso para habilitar su certificado de muestra.')}</div><div class="hint">Los certificados de este prototipo son muestras sin firma digital y no acreditan estudios reales.</div>`}
function filterCertificateDate(v){document.querySelectorAll('.filter-row').forEach(r=>r.hidden=!!v&&r.dataset.date!==v)}
function certMarkup(c){return `<div class="certificate">${brand()}<span class="pill amber mt-6">MUESTRA · SIN VALIDEZ ACADÉMICA</span><h2>Certificado de aprobación</h2><p>Se otorga a</p><h3>${esc(studentName())}</h3><p>Por completar el curso</p><h2 style="font-family:inherit;font-size:1.25rem;margin:14px 0">${esc(c.title)}</h2><p>${c.hours} horas académicas · Nota de muestra: 18/20</p><p class="small">15 de septiembre de 2026 · Instructor: ${esc(c.instructor)}</p><div class="mt-6 small">DEMO-PED-2026-${String(c.id).padStart(4,'0')}</div><p class="small">Representación visual · Firma digital pendiente de integración</p></div>`}
function showCertificate(id){openModal('Tu certificado',certMarkup(course(id))+`<div class="modal-actions">${button('Descargar PDF',`certificatePDF(${id})`,'','download')}</div>`)}
function verify(){return `<div style="max-width:680px;margin:20px auto">${heading('Verifica un certificado','Consulta un certificado de muestra por su código único.')}<section class="card pad"><form onsubmit="verifyCode(event)"><label for="certCode">Código de verificación</label><div class="flex gap-2"><input id="certCode" required placeholder="DEMO-PED-2026-0003" value="${arg?esc(decodeURIComponent(arg)):''}"><button class="btn">Verificar</button></div><p class="small muted mt-4">Prueba con DEMO-PED-2026-0003. La consulta es local; no valida certificados reales.</p></form><div id="verifyResult" aria-live="polite"></div></section></div>`}
function verifyCode(e){e.preventDefault();const v=$('#certCode').value.trim().toUpperCase(),c=db.courses.find(c=>v==='DEMO-PED-2026-'+String(c.id).padStart(4,'0')&&progress(c)===100);$('#verifyResult').innerHTML=c?`<div class="hint">✓ Certificado de muestra encontrado</div>${certMarkup(c)}`:`<div class="error">No encontramos un certificado con ese código. Revisa los caracteres e inténtalo de nuevo.</div>`}
function reviewForm(id){openModal('Cuéntanos tu experiencia',`<form onsubmit="saveReview(event,${id})">${selectField('Calificación','stars',['5','4','3','2','1'])}${textField('Tu reseña (máximo 500 caracteres)','text','','required maxlength="500"')}<button class="btn w-full">Publicar reseña de muestra</button></form>`)}
function saveReview(e,id){e.preventDefault();if(progress(course(id))!==100)return;const f=Object.fromEntries(new FormData(e.target));db.reviews.push({...f,course:id});save();closeModal();toast('Reseña añadida. La valoración del curso se actualizó.')}
function shareAchievement(id){openModal('Comparte tu logro',`<p class="muted text-sm">${esc(course(id).title)} · Certificado de demostración</p><div class="hint">Código: DEMO-PED-2026-${String(id).padStart(4,'0')}<br>El enlace público estará disponible cuando se publique el sistema.</div><div class="flex gap-3 flex-wrap">${['LinkedIn','Facebook','WhatsApp'].map(n=>button(n,`sharePreview('${n}',${id})`,'secondary')).join('')}</div>`)}
function sharePreview(network,id){openModal('Vista previa para '+network,`<div class="card pad"><span class="eyebrow muted">LOGRO PEDSAR · DEMOSTRACIÓN</span><h2 class="mt-4">${esc(studentName())}</h2><p class="muted mt-4">Completó ${esc(course(id).title)}.</p><span class="pill mt-4">${course(id).hours} horas</span></div><div class="hint">Esta vista no publica en ${network}. La imagen social y el enlace verificable requieren un sistema publicado.</div>${button('Copiar texto',`copyText('He completado un curso en PEDSAR. Certificado de demostración: DEMO-PED-2026-${String(id).padStart(4,'0')}')`,'secondary')}`)}
function payments(){const admin=role==='administrador';return heading(admin?'Pagos y reembolsos':'Pagos y comprobantes',admin?'Revisa ingresos, valida pagos y atiende solicitudes.':'Consulta tus inscripciones y conserva tus comprobantes.')+`<div class="stats">${stat('Total pagado',money(db.payments.filter(p=>p.status==='Pagado').reduce((s,p)=>s+p.amount,0)),'Registros de demostración','wallet')}${stat('Pagos registrados',db.payments.length,'Historial local','file')}${stat('Pendientes',db.payments.filter(p=>p.status==='Pendiente').length,'Por validar','clock')}${stat('Reembolsos',db.payments.filter(p=>p.status==='Reembolso solicitado').length,'Solicitudes en revisión','chat')}</div><div class="toolbar"><input aria-label="Buscar pagos" placeholder="Buscar curso, método o estado…" oninput="filterRows(this.value)">${button('Exportar CSV','paymentsCSV()','secondary','download')}</div>`+table(['Curso / Fecha','Método','Monto','Estado','Acciones'],db.payments.map(p=>`<tr class="filter-row" data-search="${esc(course(p.course).title+' '+p.method+' '+p.status)}"><td><strong>${esc(course(p.course).title)}</strong><small>${p.date}</small></td><td>${esc(p.method)}</td><td>${money(p.amount)}</td><td><span class="pill ${p.status==='Pagado'?'':p.status==='Reembolsado'?'gray':'amber'}">${esc(p.status)}</span></td><td><div class="flex gap-2 flex-wrap">${p.status==='Pagado'?button('PDF',`receiptPDF(${p.id})`,'secondary tiny','download')+button('XML',`receiptXML(${p.id})`,'ghost tiny'):''}${!admin&&p.status==='Pagado'?button('Reembolso',`refundForm(${p.id})`,'ghost tiny'):''}${admin&&p.status==='Pendiente'?button('Validar pago',`validatePayment(${p.id})`,'tiny'):''}${admin&&p.status==='Reembolso solicitado'?button('Revisar',`reviewRefund(${p.id})`,'secondary tiny'):''}</div></td></tr>`))+`<div class="hint">Comprobantes de muestra, sin validez tributaria. Ninguna acción realiza cobros ni devoluciones de dinero.</div>`}
function validatePayment(id){const p=db.payments.find(p=>p.id===id);p.status='Pagado';db.progress[p.course]=0;db.done[p.course]=[];log('Pago validado',course(p.course).title);render();toast('Pago validado en la demostración. Acceso al curso habilitado.')}
function refundForm(id){openModal('Solicitar reembolso',`<form onsubmit="requestRefund(event,${id})"><p class="muted text-sm mb-4">${esc(course(db.payments.find(p=>p.id===id).course).title)}</p>${textField('Motivo de la solicitud','reason','','required minlength="10"')}<button class="btn w-full">Enviar solicitud de muestra</button></form>`)}
function requestRefund(e,id){e.preventDefault();const p=db.payments.find(x=>x.id===id);p.status='Reembolso solicitado';p.reason=new FormData(e.target).get('reason');log('Reembolso solicitado',p.reason);closeModal();render()}
function reviewRefund(id){const p=db.payments.find(x=>x.id===id);openModal('Revisar reembolso',`<p><strong>${money(p.amount)}</strong> · ${esc(course(p.course).title)}</p><p class="muted mt-4">${esc(p.reason)}</p><div class="hint">La decisión solo modifica el estado de esta demostración.</div><div class="modal-actions">${button('Rechazar',`decideRefund(${id},false)`,'secondary')}${button('Aprobar',`decideRefund(${id},true)`)}</div>`)}
function decideRefund(id,approve){const p=db.payments.find(x=>x.id===id);p.status=approve?'Reembolsado':'Pagado';if(approve){delete db.progress[p.course];delete db.done[p.course];course(p.course).enrolled=Math.max(0,course(p.course).enrolled-1)}log('Reembolso '+(approve?'aprobado':'rechazado'),course(p.course).title);closeModal();render()}
function messages(){const people=role==='instructor'?['Javier Curo','Camila Rojas','Luis García']:['Eduardo Campos','Ana Torres','Soporte académico'];selectedChat=Math.min(selectedChat,2);return heading(role==='instructor'?'Bandeja de entrada':'Mensajes','Mantén cerca a quienes te acompañan en tu aprendizaje.')+`<div class="toolbar"><input placeholder="Buscar conversación…" aria-label="Buscar conversación" oninput="document.querySelectorAll('.conversation').forEach(x=>x.hidden=!x.textContent.toLowerCase().includes(this.value.toLowerCase()))"><select aria-label="Filtrar mensajes por curso" onchange="filterConversationCourse(this.value)"><option>Todos los cursos</option><option>Desarrollo web con React</option><option>Análisis de datos con Python</option></select></div><div class="card chat-layout"><aside class="conversations">${people.map((p,i)=>`<button class="conversation ${i===selectedChat?'active':''}" data-course="${i===0?1:i===1?2:0}" onclick="selectedChat=${i};render()"><div class="flex items-center gap-3"><span class="avatar">${p.split(' ').map(x=>x[0]).slice(0,2).join('')}</span><div><strong class="text-sm">${p}</strong><p class="small muted">${i===0?'Desarrollo web con React':i===1?'Análisis de datos':'Atención al estudiante'}</p></div></div></button>`).join('')}</aside><section class="chat-content"><h2>${people[selectedChat]}</h2><span class="small muted">Conversación de demostración</span><div class="bubbles"><div class="bubble">Hola, ¿en qué puedo ayudarte con el curso?<p class="small muted mt-4">09:30</p></div>${db.messages.filter(m=>m.chat===selectedChat&&m.role===role).map(m=>`<div class="bubble mine">${esc(m.text)}<p class="small muted mt-4">${esc(m.time)}</p></div>`).join('')}</div><form class="flex gap-2" onsubmit="sendMessage(event)"><input name="text" aria-label="Escribir mensaje" required maxlength="1500" placeholder="Escribe tu mensaje…"><button class="btn" aria-label="Enviar mensaje">${icon('arrow')}</button></form></section></div>`}
function filterConversationCourse(v){document.querySelectorAll('.conversation').forEach(x=>x.hidden=v!=='Todos los cursos'&&Number(x.dataset.course)!==(v.startsWith('Desarrollo')?1:2))}
function sendMessage(e){e.preventDefault();db.messages.push({chat:selectedChat,role,text:new FormData(e.target).get('text'),time:new Date().toLocaleTimeString('es-PE',{hour:'2-digit',minute:'2-digit'})});save();render();toast('Mensaje añadido al prototipo. No se envió a una persona real.')}
function community(){return heading('Comunidad de aprendizaje','Pregunta, comparte y aprende junto a tu grupo.',button('Nuevo tema','topicForm()','','plus'))+`<div class="toolbar"><input placeholder="Buscar temas de discusión…" aria-label="Buscar temas" oninput="filterRows(this.value)"><select aria-label="Curso del foro" onchange="document.querySelectorAll('.topic').forEach(x=>x.hidden=this.value!=='0'&&x.dataset.course!==this.value)"><option value="0">Todos los cursos</option>${db.courses.map(c=>`<option value="${c.id}">${esc(c.title)}</option>`).join('')}</select></div><div class="card pad">${db.topics.map(t=>`<article class="list-item filter-row topic" data-course="${t.course}" data-search="${esc(t.title+' '+t.text)}"><span class="avatar">${esc(t.author[0])}</span><div style="flex:1"><span class="small muted">${esc(course(t.course).title)}</span><h3 class="mt-4">${esc(t.title)}</h3><p>${esc(t.text)}</p><p class="small">${esc(t.author)} · ${t.replies.length} respuestas</p>${t.replies.map(r=>`<div class="hint">${esc(r)}</div>`).join('')}${button('Responder',`replyForm(${t.id})`,'ghost tiny','chat')}</div></article>`).join('')}</div>${role==='instructor'?`<div class="section-head"><h2>Comentarios en lecciones</h2></div><div class="card pad">${db.comments.map(c=>`<div class="list-item"><div style="flex:1"><h3>${esc(c.author)} · ${esc(course(c.course).title)}</h3><p>${esc(c.text)}</p><span class="pill ${c.resolved?'':'amber'}">${c.resolved?'Resuelto':'Pendiente'}</span></div>${button('Responder',`commentReply(${c.id})`,'secondary tiny')}</div>`).join('')||empty('No hay comentarios pendientes')}</div>`:''}`}
function topicForm(){openModal('Nuevo tema de discusión',`<form onsubmit="saveTopic(event)">${selectField('Curso','course',db.courses.map(c=>c.title))}${field('Título del tema','title','','text','required maxlength="150"')}${textField('Tu pregunta o aporte','text','','required maxlength="2000"')}<button class="btn w-full">Publicar tema</button></form>`)}
function saveTopic(e){e.preventDefault();const f=Object.fromEntries(new FormData(e.target));db.topics.unshift({...f,id:Date.now(),course:db.courses.find(c=>c.title===f.course).id,author:role==='instructor'?'Eduardo Campos':studentName(),replies:[]});save();closeModal();render()}

function commentReply(id){openModal('Responder al comentario',`<form onsubmit="event.preventDefault();const c=db.comments.find(x=>x.id===${id});c.reply=new FormData(this).get('reply');c.resolved=true;save();closeModal();render()">${textField('Respuesta del instructor','reply','','required')}<button class="btn w-full">Responder y marcar resuelto</button></form>`)}
function achievements(){const points=Object.values(db.done).flat().length*50;return heading('Tus logros merecen verse','Cada lección suma. Cada meta abre una nueva oportunidad.')+`<div class="stats">${stat('Tus puntos',points,'50 puntos por lección','star')}${stat('Cursos completados',Object.values(db.progress).filter(p=>p===100).length,'Metas alcanzadas','award')}${stat('Lecciones completadas',Object.values(db.done).flat().length,'Habilidades en desarrollo','check')}${stat('Ranking ilustrativo','3.º','Clasificación semanal de ejemplo','chart')}</div><div class="cols3">${[['Primer gran paso','Completa tu primer curso.'],['Aprendiz constante','Completa cinco cursos.'],['Siempre presente','Alcanza 100% de asistencia.']].map((b,i)=>`<div class="card pad text-center" style="${i?'opacity:.65':''}"><div class="badge-medal">${icon('award')}</div><h3>${b[0]}</h3><p class="muted text-sm mt-4">${b[1]}</p><span class="pill ${i?'gray':''} mt-4">${i?'Por desbloquear':'Desbloqueada'}</span></div>`).join('')}</div><div class="section-head"><h2>Comunidad que avanza</h2><select style="width:auto" aria-label="Ámbito del ranking" onchange="toast('Ranking ilustrativo: '+this.value)"><option>Ranking global</option><option>Desarrollo web con React</option></select></div>${table(['Posición','Estudiante','Puntos'],[['1','Camila Rojas','850'],['2','Luis García','720'],['3',studentName(),points]].map(x=>`<tr><td>${x[0]}</td><td>${esc(x[1])}</td><td><strong>${x[2]}</strong></td></tr>`))}`}
function profile(){return heading('Mi cuenta y preferencias','Actualiza tu perfil y elige cómo quieres aprender.')+`<div class="cols2"><section class="card pad"><h2>Información personal</h2><div class="flex items-center gap-4 mt-6"><span class="avatar" id="profileAvatar" style="width:68px;height:68px;font-size:1.4rem;overflow:hidden">${esc(db.profile.name[0])}</span><label class="btn secondary tiny" style="cursor:pointer">Cambiar foto<input type="file" accept="image/png,image/jpeg" hidden onchange="profilePhoto(this.files[0])"></label></div><form onsubmit="saveProfile(event)" class="mt-6"><div class="cols2">${field('Nombres','name',db.profile.name,'text','required')}${field('Apellidos','last',db.profile.last,'text','required')}${field('Celular','phone',db.profile.phone,'tel','pattern="[0-9]{9}" title="Ingresa 9 dígitos"')}${field('Fecha de nacimiento','birth',db.profile.birth,'date')}</div>${field('Correo electrónico','email',db.profile.email,'email','required')}<button class="btn">Guardar cambios</button></form><div class="mt-6">${button('Cambiar contraseña',"passwordForm()",'secondary','shield')}</div></section><section><div class="card pad"><h2>Accesibilidad y notificaciones</h2>${[['contrast','Alto contraste','Mejora la lectura de textos y controles.'],['large','Texto más grande','Aumenta el tamaño de la interfaz.'],['email','Avisos por correo','Confirmaciones y recordatorios.'],['inapp','Avisos en la plataforma','Clases, evaluaciones y mensajes.'],['push','Notificaciones del navegador','Vista previa de preferencia push.']].map(([key,title,sub])=>`<label class="settings-row"><span>${title}<small>${sub}</small></span><input type="checkbox" aria-label="${title}" ${db.settings[key]?'checked':''} onchange="db.settings.${key}=this.checked;save();applySettings();${key==='push'?"toast('Preferencia guardada. Push real requiere servidor y permisos del navegador.')":''}"></label>`).join('')}<div class="hint">Recordatorios previstos: 24 horas antes de una evaluación y 1 hora antes de una clase. En el prototipo no se envían avisos externos.</div>${button('Instalar aplicación',"integrationInfo('Aplicación PWA')",'secondary','download')}</div><div class="card pad mt-6"><h2>Privacidad y datos personales</h2><p class="muted text-sm mt-4">Exporta tus datos de demostración o elimina la información guardada en este navegador.</p><div class="flex gap-3 flex-wrap mt-6">${button('Exportar mis datos','exportPersonal()','secondary','download')}${button('Eliminar datos locales','deleteData()','danger')}</div></div></section></div>`}
function saveProfile(e){e.preventDefault();db.profile={...db.profile,...Object.fromEntries(new FormData(e.target))};log('Perfil actualizado','Datos de demostración');render();toast('Tu perfil se actualizó.')}
function profilePhoto(f){if(!f)return;if(!['image/png','image/jpeg'].includes(f.type)||f.size>2*1024*1024){toast('Usa una imagen JPG/PNG de hasta 2 MB.');return}const url=URL.createObjectURL(f);objectURLs.push(url);$('#profileAvatar').innerHTML=`<img src="${url}" alt="Foto de perfil local" style="width:100%;height:100%;object-fit:cover">`;toast('Vista previa local de la foto. No se subió a un servidor.')}
function passwordForm(){openModal('Cambiar contraseña',`<form onsubmit="event.preventDefault();if(this.newpass.value!==this.confirm.value){toast('Las contraseñas no coinciden.');return}closeModal();toast('Validación completada. La contraseña de acceso de prueba no cambia.')">${field('Contraseña actual de prueba','current','','password','required')}${field('Nueva contraseña','newpass','','password','required minlength="8" pattern="(?=.*[A-Za-z])(?=.*[0-9]).{8,}"')}${field('Confirma la nueva contraseña','confirm','','password','required')}<div class="hint">Formulario de referencia. No se almacenan contraseñas.</div><button class="btn w-full">Validar cambio</button></form>`)}
const notices=[{id:1,type:'Clases',title:'Tu próxima clase está cerca',text:'Componentes y estado en React · 22 de septiembre, 19:00.',path:'agenda'},{id:2,type:'Evaluaciones',title:'Una nueva oportunidad para practicar',text:'Fundamentos de React ya está disponible.',path:'evaluaciones'},{id:3,type:'Certificados',title:'Tu certificado está disponible',text:'Revisa tu certificado de Excel para la gestión empresarial.',path:'certificados'}];
function notifications(){return heading('Notificaciones','Tus novedades, en un solo lugar.',button('Marcar todas como leídas',"db.readNotices=[1,2,3];save();render()",'secondary','check'))+`<div class="toolbar"><select id="noticeType" aria-label="Filtrar notificaciones" onchange="filterNotices()"><option>Todas</option><option>Clases</option><option>Evaluaciones</option><option>Certificados</option></select></div><div class="card pad" id="noticeList"></div>`}
function filterNotices(){$('#noticeList').innerHTML=notices.filter(n=>$('#noticeType').value==='Todas'||n.type===$('#noticeType').value).map(n=>`<div class="list-item"><span class="stat-icon">${icon(n.type==='Clases'?'calendar':n.type==='Certificados'?'award':'checklist')}</span><div style="flex:1"><span class="pill ${db.readNotices.includes(n.id)?'gray':''}">${db.readNotices.includes(n.id)?'Leída':'Nueva'}</span><h3 class="mt-4">${n.title}</h3><p>${n.text}</p><a class="btn ghost tiny" href="#${n.path}" onclick="db.readNotices.push(${n.id});save()">Ver detalle →</a></div>${button('Marcar leída',`db.readNotices=[...new Set([...db.readNotices,${n.id}])];save();render()`,'secondary tiny')}</div>`).join('')}
function managementDashboard(){const admin=role==='administrador',income=db.payments.filter(p=>p.status==='Pagado').reduce((s,p)=>s+p.amount,0);return heading(admin?'Una mirada a todo lo que avanza.':'Hola, Eduardo. Tu aula te espera.',admin?'Resumen de la operación · Septiembre 2026':'Acompaña el aprendizaje de tu comunidad.',link(admin?'Gestionar cursos':'Mis cursos','gestion-cursos','','plus'))+`<div class="stats">${stat(admin?'Usuarios registrados':'Estudiantes',db.users.length,'Registros de ejemplo','users')}${stat('Cursos publicados',db.courses.filter(c=>c.status==='Publicado').length,'Oferta formativa activa','book')}${stat('Inscripciones',db.payments.length,'Matrículas de demostración','file')}${stat(admin?'Ingresos registrados':'Lecciones completadas',admin?money(income):Object.values(db.done).flat().length,admin?'Pagos con estado pagado':'Aprendizaje de muestra',admin?'wallet':'check')}</div><div class="split"><section><div class="card pad"><div class="flex justify-between items-center"><h2>Evolución de matrículas</h2><span class="pill gray">Serie ilustrativa</span></div><p class="small muted mt-4">Abril a septiembre · Cantidad de inscripciones</p><div class="chart" role="img" aria-label="Matrículas ilustrativas: abril 18, mayo 24, junio 21, julio 32, agosto 36, septiembre 40">${[18,24,21,32,36,40].map((n,i)=>`<div class="bar" style="height:${n*3}px"><b>${n}</b><span>${['Abr','May','Jun','Jul','Ago','Sep'][i]}</span></div>`).join('')}</div></div><div class="section-head"><h2>Cursos con mayor demanda</h2><a href="#reportes">Ver reportes ↗</a></div>${table(['Curso','Estudiantes','Ocupación'],[...db.courses].sort((a,b)=>b.enrolled-a.enrolled).slice(0,4).map(c=>`<tr><td><strong>${esc(c.title)}</strong><small>${esc(c.instructor)}</small></td><td>${c.enrolled} / ${c.capacity}</td><td><div class="progress"><i style="width:${c.enrolled/c.capacity*100}%"></i></div></td></tr>`))}</section><aside class="aside-stack"><div class="card pad"><h2>Por modalidad</h2>${['Virtual','Presencial','Semipresencial'].map(m=>`<div class="settings-row"><span class="text-sm">${m}</span><strong>${db.courses.filter(c=>c.mode===m).length}</strong></div>`).join('')}<p class="small muted mt-4">Distribución de cursos registrados.</p></div><div class="card pad note-panel mt-6"><h3>${admin?'Mantén tus pagos al día':'Próximas sesiones'}</h3><p>${admin?'Revisa las matrículas pendientes y las solicitudes de reembolso.':'Organiza tus clases y registra la asistencia de tus estudiantes.'}</p>${link(admin?'Revisar pagos':'Ver agenda',admin?'pagos':'agenda','ghost','arrow')}</div><div class="card pad mt-6"><h2>Accesos rápidos</h2><div class="grid gap-3 mt-4">${link('Gestionar contenidos',admin?'gestion-cursos':'contenidos','secondary','folder')}${link('Reportes académicos','reportes','secondary','chart')}${link(admin?'Usuarios y roles':'Mensajes',admin?'usuarios':'mensajes','secondary','users')}</div></div></aside></div>`}
function filterRows(q){document.querySelectorAll('.filter-row').forEach(r=>r.hidden=!(r.dataset.search||r.textContent).toLowerCase().includes(q.toLowerCase()))}
function manageCourses(){return heading('Gestión de cursos','Crea, organiza y publica tu oferta de capacitación.',button('Nuevo curso','courseForm()','','plus'))+`<div class="toolbar"><input aria-label="Buscar cursos en gestión" placeholder="Buscar por título o instructor…" oninput="filterRows(this.value)">${button('Plantillas','templatesModal()','secondary','folder')}</div>`+table(['Curso','Modalidad / Nivel','Cupos','Precio','Estado','Acciones'],db.courses.map(c=>`<tr class="filter-row" data-search="${esc(c.title+' '+c.instructor)}"><td><strong>${esc(c.title)}</strong><small>${esc(c.instructor)}</small></td><td>${esc(c.mode)}<small>${esc(c.level)}</small></td><td>${c.enrolled}/${c.capacity}</td><td>${money(c.price)}</td><td><span class="pill ${c.status==='Publicado'?'':'amber'}">${esc(c.status)}</span>${c.publishAt?`<small>${esc(c.publishAt.replace('T',' '))}</small>`:''}</td><td>${button('Gestionar',`courseActions(${c.id})`,'secondary tiny','edit')}</td></tr>`))}
function courseForm(id,template){let c=id?course(id):template?{...db.templates.find(t=>t.id===template),title:''}:{title:'',category:db.categories[0],level:'Básico',mode:'Virtual',price:200,hours:32,instructor:'Eduardo Campos',capacity:25,enrolled:0,description:'',requirements:'',status:'Borrador',tag:'CURSO',color:''};openModal(id?'Editar curso':'Crear nuevo curso',`<form onsubmit="saveCourse(event,${id||0})">${field('Nombre del curso','title',c.title,'text','required maxlength="100"')}${textField('Descripción','description',c.description,'required')}<div class="cols2">${selectField('Categoría','category',db.categories,c.category)}${selectField('Nivel','level',['Básico','Intermedio','Avanzado'],c.level)}${selectField('Modalidad','mode',['Virtual','Presencial','Semipresencial'],c.mode)}${field('Instructor','instructor',c.instructor,'text','required')}${field('Duración (horas)','hours',c.hours,'number','min="1" required')}${field('Precio total (S/)','price',c.price,'number','min="0" step="0.01" required')}${field('Cupo máximo','capacity',c.capacity,'number',`min="${c.enrolled||1}" required`)}${selectField('Estado','status',['Borrador','Publicado','Programado','Despublicado'],c.status)}</div>${textField('Requisitos previos','requirements',c.requirements,'required')}${field('Fecha y hora de publicación (si corresponde)','publishAt',c.publishAt||'','datetime-local')}<div class="field"><label for="courseImage">Imagen destacada · JPG/PNG, hasta 2 MB</label><input type="file" id="courseImage" accept="image/jpeg,image/png" onchange="validateFile(this,2,['image/jpeg','image/png'])"><small>Vista del control de carga. El archivo no se sube a un servidor.</small></div><button class="btn w-full">Guardar curso</button></form>`)}
function saveCourse(e,id){e.preventDefault();const f=Object.fromEntries(new FormData(e.target));if(f.status==='Programado'&&!f.publishAt){toast('Define una fecha de publicación.');return}const old=id?course(id):{},c={...old,...f,id:id||Date.now(),price:Number(f.price),hours:Number(f.hours),capacity:Number(f.capacity),enrolled:old.enrolled||0,tag:old.tag||f.category.toUpperCase().slice(0,10),color:old.color||'blue'};db.courses=id?db.courses.map(x=>x.id===id?c:x):[...db.courses,c];log('Curso guardado',c.title);closeModal();render();toast(c.status==='Programado'?'Programación registrada. La ejecución automática requiere backend.':'Curso guardado en la demostración.')}
function courseActions(id){const c=course(id);openModal(c.title,`<div class="grid gap-3">${button('Editar información',`courseForm(${id})`,'secondary','edit')}${button(c.status==='Publicado'?'Despublicar curso':'Publicar ahora',`publishCourse(${id})`,'secondary','globe')}${button('Duplicar curso',`duplicateForm(${id})`,'secondary','book')}${button('Guardar como plantilla',`saveTemplate(${id})`,'secondary','folder')}${role==='instructor'?button('Organizar contenidos',"closeModal();go('contenidos')",'secondary','folder'):''}${button('Eliminar curso',`deleteCourse(${id})`,'danger')}</div>`)}
function publishCourse(id){const c=course(id);c.status=c.status==='Publicado'?'Despublicado':'Publicado';delete c.publishAt;log('Publicación de curso',c.title+' · '+c.status);closeModal();render()}
function duplicateForm(id){openModal('Duplicar curso',`<form onsubmit="duplicateCourse(event,${id})">${field('Nombre de la copia','title',course(id).title+' · Nueva cohorte','text','required')}<label class="check"><input type="checkbox" name="copy" checked>Copiar módulos y contenidos</label><button class="btn w-full mt-6">Crear copia</button></form>`)}
function duplicateCourse(e,id){e.preventDefault();const f=new FormData(e.target),c=structuredClone(course(id)),nid=Date.now();c.id=nid;c.title=f.get('title');c.status='Borrador';c.enrolled=0;delete c.publishAt;db.courses.push(c);if(f.get('copy'))db.materials.push(...db.materials.filter(m=>Number(m.course)===id).map((m,i)=>({...m,id:nid+i+1,course:nid})));log('Curso duplicado',c.title);closeModal();render()}

function deleteCourse(id){const c=course(id);if(c.enrolled>0){toast('Un curso con estudiantes se puede despublicar, pero no eliminar.');return}openModal('Eliminar curso de muestra',`<p>¿Eliminar ${esc(c.title)} de la demostración?</p><div class="modal-actions">${button('Cancelar','closeModal()','secondary')}${button('Eliminar',`db.courses=db.courses.filter(x=>x.id!==${id});log('Curso eliminado','Registro de demostración');closeModal();render()`,'danger')}</div>`)}
function users(){return heading('Usuarios e instructores','Gestiona perfiles, permisos y accesos temporales.',button('Nuevo usuario','userForm()','','plus'))+`<div class="toolbar"><input placeholder="Buscar por nombre, correo o rol…" aria-label="Buscar usuarios" oninput="filterRows(this.value)"></div>`+table(['Usuario','Rol','Estado','Acciones'],db.users.map(u=>`<tr class="filter-row"><td><strong>${esc(u.name)}</strong><small>${esc(u.email)}</small></td><td>${esc(u.role)}${u.until?`<small>Temporal hasta ${esc(u.until)}</small>`:''}</td><td><span class="pill ${u.status==='Activo'?'':'gray'}">${u.status}</span></td><td>${button('Editar',`userForm(${u.id})`,'secondary tiny','edit')}</td></tr>`))+`<div class="hint">Los roles de esta maqueta cambian la navegación. Los permisos reales deberán validarse en el servidor.</div>`}
function userForm(id){const u=db.users.find(x=>x.id===id)||{};openModal(id?'Editar usuario':'Nuevo usuario',`<form onsubmit="saveUser(event,${id||0})">${field('Nombre completo','name',u.name||'','text','required')}${field('Correo electrónico','email',u.email||'','email','required')}<div class="cols2">${selectField('Rol','role',['Estudiante','Instructor','Administrador'],u.role)}${selectField('Estado','status',['Activo','Inactivo'],u.status)}${field('Inicio de rol temporal (opcional)','from',u.from||'','date')}${field('Fin de rol temporal (opcional)','until',u.until||'','date')}</div>${textField('Biografía y especialidades del instructor','bio',u.bio||'')}${field('Certificaciones','certifications',u.certifications||'')}${selectField('Curso asignado','assigned',['Sin asignar',...db.courses.map(c=>c.title)],u.assigned)}<p class="small muted">La revocación automática del rol temporal requiere un proceso de servidor.</p><button class="btn w-full mt-4">Guardar usuario</button></form>`)}
function saveUser(e,id){e.preventDefault();const f=Object.fromEntries(new FormData(e.target));if(db.users.some(u=>u.id!==id&&u.email===f.email)){toast('Ya existe un usuario con ese correo.');return}if((f.from&&!f.until)||(!f.from&&f.until)||(f.from&&f.until<f.from)){toast('Define un periodo temporal válido con inicio y fin.');return}const u={...f,id:id||Date.now()};db.users=id?db.users.map(x=>x.id===id?u:x):[...db.users,u];log('Usuario actualizado',f.name+' · '+f.role);closeModal();render()}
function categories(){return heading('Categorías','Organiza el catálogo y facilita el descubrimiento de cursos.',button('Nueva categoría','categoryForm()','','plus'))+`<div class="cols3">${db.categories.map((c,i)=>`<article class="card pad"><span class="stat-icon" style="width:40px">${icon('folder')}</span><h2 class="mt-4">${esc(c)}</h2><p class="muted text-sm mt-4">${db.courses.filter(x=>x.category===c).length} cursos registrados</p>${button('Editar categoría',`categoryForm(${i})`,'secondary mt-6','edit')}</article>`).join('')}</div>`}
function categoryForm(i=-1){const details=db.categoryDetails?.[db.categories[i]]||{};openModal(i<0?'Nueva categoría':'Editar categoría',`<form onsubmit="saveCategory(event,${i})">${field('Nombre','name',i<0?'':db.categories[i],'text','required')}${textField('Descripción','description',details.description||'')}${field('Subcategorías (separadas por comas)','children',details.children||'')}${selectField('Estado','status',['Activa','Inactiva'],details.status)}<div class="field"><label for="catImg">Imagen</label><input type="file" id="catImg" accept="image/png,image/jpeg" onchange="validateFile(this,2,['image/png','image/jpeg'])"></div><button class="btn w-full">Guardar categoría</button></form>`)}
function saveCategory(e,i){e.preventDefault();const f=Object.fromEntries(new FormData(e.target)),name=f.name.trim();if(db.categories.some((c,j)=>j!==i&&c.toLowerCase()===name.toLowerCase())){toast('La categoría ya existe.');return}const old=db.categories[i];if(i<0)db.categories.push(name);else{db.categories[i]=name;db.courses.forEach(c=>{if(c.category===old)c.category=name})}db.categoryDetails??={};db.categoryDetails[name]=f;log('Categoría actualizada',name);closeModal();render()}
function enrollments(){return heading('Inscripciones','Consulta el estado de cada matrícula.',button('Exportar CSV','paymentsCSV()','secondary','download'))+table(['Estudiante','Curso','Fecha','Estado académico','Pago'],db.payments.map(p=>`<tr><td><strong>${esc(studentName())}</strong><small>${esc(db.profile.email)}</small></td><td>${esc(course(p.course).title)}</td><td>${p.date}</td><td>${p.course in db.progress?progress(course(p.course))+'% de avance':'Sin acceso activo'}</td><td><span class="pill ${p.status==='Pagado'?'':'amber'}">${p.status}</span></td></tr>`))}
function contents(){return heading('Contenidos del curso','Organiza materiales en módulos y mantén todo al alcance del estudiante.',button('Añadir material','materialForm()','','plus'))+`<div class="toolbar"><select id="contentCourse" aria-label="Filtrar materiales por curso" onchange="filterMaterials(this.value)"><option value="0">Todos los cursos</option>${db.courses.map(c=>`<option value="${c.id}">${esc(c.title)}</option>`).join('')}</select>${link('Sesiones y horarios','agenda','secondary','calendar')}</div><div class="card pad"><h2>Materiales publicados</h2><div class="hint">Cada curso incluye una guía PDF de muestra por módulo. Los materiales que añadas se mostrarán también en el aula.</div>${db.materials.map(m=>`<div class="list-item material" data-course="${m.course}"><span class="stat-icon">${icon(m.type==='Video'?'play':'file')}</span><div style="flex:1"><h3>${esc(m.title)}</h3><p>${esc(course(m.course).title)} · Módulo ${m.module} · ${esc(m.type)}</p><p>${esc(m.filename||m.url||'')}</p></div>${button('Editar',`materialForm(${m.id})`,'secondary tiny')}${button('Eliminar',`removeMaterial(${m.id})`,'ghost tiny')}</div>`).join('')||empty('Añade tu primer material','PDF, video o enlace, organizado por módulo.')}</div>`}

function materialForm(id){const m=db.materials.find(x=>x.id===id)||{};openModal(id?'Editar material':'Añadir material',`<form onsubmit="saveMaterial(event,${id||0})">${field('Título','title',m.title||'','text','required')}${selectField('Curso','course',db.courses.map(c=>c.title),m.course?course(m.course).title:'')}<div class="cols2">${selectField('Módulo','module',['1','2','3','4'],m.module)}${selectField('Tipo de material','type',['PDF','Video','Enlace'],m.type)}</div>${field('Enlace HTTPS (para material enlazado)','url',m.url||'','url')}<div class="field"><label for="materialFile">Archivo · PDF, MP4 o WebM · Máximo 50 MB</label><input id="materialFile" name="file" type="file" accept=".pdf,.mp4,.webm" onchange="validateFile(this,50,['application/pdf','video/mp4','video/webm'])"></div><div class="hint">Se validan extensión, tipo y tamaño. El análisis de malware y el almacenamiento seguro son servicios de backend.</div><button class="btn w-full">Guardar material</button></form>`)}
function validateFile(input,max,types){const f=input.files[0];if(!f)return false;const allowed={'application/pdf':/\.pdf$/i,'video/mp4':/\.mp4$/i,'video/webm':/\.webm$/i,'image/png':/\.png$/i,'image/jpeg':/\.jpe?g$/i};if(!types.includes(f.type)||!allowed[f.type]?.test(f.name)||f.size>max*1024*1024){input.value='';toast(`Archivo inválido. Verifica el formato y el límite de ${max} MB.`);return false}toast('Formato y tamaño válidos. Archivo listo para la vista de demostración.');return true}
function safeUrl(url){try{return new URL(url).protocol==='https:'}catch{return false}}
function saveMaterial(e,id){e.preventDefault();const f=new FormData(e.target),type=f.get('type'),file=$('#materialFile').files[0],url=f.get('url');if(type==='Enlace'&&!safeUrl(url)){toast('Ingresa un enlace HTTPS válido.');return}if(type!=='Enlace'&&!file&&!id){toast('Selecciona un archivo.');return}if(file&&((type==='PDF'&&file.type!=='application/pdf')||(type==='Video'&&!file.type.startsWith('video/')))){toast('El archivo no coincide con el tipo de material.');return}const prev=db.materials.find(x=>x.id===id)||{},m={...prev,id:id||Date.now(),title:f.get('title'),course:db.courses.find(c=>c.title===f.get('course')).id,module:Number(f.get('module')),type,url:type==='Enlace'?url:'',filename:file?.name||prev.filename||''};db.materials=id?db.materials.map(x=>x.id===id?m:x):[...db.materials,m];log('Material guardado',m.title);closeModal();render()}
function removeMaterial(id){openModal('Eliminar material',`<p>Se quitará este material de la demostración.</p><div class="modal-actions">${button('Cancelar','closeModal()','secondary')}${button('Eliminar',`db.materials=db.materials.filter(x=>x.id!==${id});save();closeModal();render()`,'danger')}</div>`)}
function attendance(){const list=db.users.filter(u=>u.role==='Estudiante');return heading('Estudiantes y asistencia','Registra la participación por sesión y justifica las ausencias.',button('Exportar reporte','academicCSV()','secondary','download'))+`<div class="toolbar"><select id="attSession" aria-label="Seleccionar sesión" onchange="renderAttendance()">${db.sessions.map(s=>`<option value="${s.id}">${esc(s.title)} · ${s.date}</option>`).join('')}</select>${button('Importar desde Zoom',"integrationInfo('Asistencia desde Zoom')",'secondary')}</div><div id="attendanceTable">${attendanceTable(list,db.sessions[0]?.id)}</div>`}
function attendanceTable(list,sid){return table(['Estudiante','Progreso de muestra','Asistencia','Justificación'],list.map(u=>{const a=db.attendance[sid+'-'+u.id]||{};return `<tr><td><strong>${esc(u.name)}</strong><small>${esc(u.email)}</small></td><td>${u.id===1?'50%':'75%'}<small>Asistencia registrada: ${attendancePercent(u.id)}%</small></td><td><select aria-label="Asistencia de ${esc(u.name)}" onchange="setAttendance(${sid},${u.id},this.value)">${['Sin registrar','Presente','Ausente','Justificado'].map(v=>`<option ${a.status===v?'selected':''}>${v}</option>`).join('')}</select></td><td><input aria-label="Justificación de ${esc(u.name)}" value="${esc(a.reason||'')}" placeholder="Motivo, si corresponde" onchange="db.attendance['${sid}-${u.id}']={...db.attendance['${sid}-${u.id}'],reason:this.value};save()"></td></tr>`}))}
function attendancePercent(uid){const arr=Object.entries(db.attendance).filter(([k])=>k.endsWith('-'+uid)).map(([,v])=>v).filter(x=>x.status&&x.status!=='Sin registrar');return arr.length?Math.round(arr.filter(x=>x.status==='Presente').length/arr.length*100):0}

function reports(){return heading('Reportes e indicadores','Consulta la información académica y administrativa.',`<div class="flex gap-2 flex-wrap">${button('Excel (.xlsx)','academicXLSX()','secondary','download')}${button('PDF','reportPDF()','','file')}</div>`)+`<div class="toolbar"><input type="date" id="reportFrom" aria-label="Desde" value="2026-08-01" style="max-width:180px"><input type="date" id="reportTo" aria-label="Hasta" value="2026-09-30" style="max-width:180px"><select id="reportCourse" aria-label="Curso del reporte"><option value="0">Todos los cursos</option>${db.courses.map(c=>`<option value="${c.id}">${esc(c.title)}</option>`).join('')}</select>${button('Aplicar filtros','filterReport()','secondary')}</div><div class="stats">${stat('Usuarios activos',db.users.filter(u=>u.status==='Activo').length,'Cuentas de demostración','users')}${stat('Ingresos pagados',money(db.payments.filter(p=>p.status==='Pagado').reduce((s,p)=>s+p.amount,0)),'Historial completo','wallet')}${stat('Certificados',Object.values(db.progress).filter(p=>p===100).length,'Cursos completados','award')}${stat('Cursos disponibles',db.courses.filter(c=>c.status==='Publicado').length,'Publicado en el catálogo','book')}</div><div id="reportTable">${reportTable(db.payments)}</div><p class="small muted mt-4">Los filtros se aplican a la tabla y sus exportaciones. Los indicadores superiores muestran el historial completo.</p>`}

/* Exportador PDF mínimo, sin dependencias. Helvetica WinAnsi; paginación automática. */
function pdfBlob(title,lines){const text=s=>String(s).replace(/[–—]/g,'-').replace(/[^\x20-\xFF]/g,' ').replace(/[\\()]/g,'\\$&'),wrap=s=>{const words=String(s).split(/\s+/),r=[];let line='';for(const w of words){if((line+' '+w).length>83){r.push(line);line=w}else line+=(line?' ':'')+w}r.push(line);return r},all=lines.flatMap(wrap),chunks=[];for(let i=0;i<all.length;i+=34)chunks.push(all.slice(i,i+34));if(!chunks.length)chunks.push([]);const objects=['<< /Type /Catalog /Pages 2 0 R >>','', '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>'];const kids=[];chunks.forEach((page,i)=>{const pageId=objects.length+1,streamId=pageId+1;kids.push(pageId+' 0 R');objects.push(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Resources << /Font << /F1 3 0 R >> >> /Contents ${streamId} 0 R >>`);const stream=`0.07 0.24 0.23 rg\n40 765 515 42 re f\nBT /F1 20 Tf 1 1 1 rg 56 778 Td (PEDSAR) Tj ET\nBT /F1 17 Tf 0.1 0.2 0.2 rg 45 728 Td (${text(title)}) Tj ET\nBT /F1 11 Tf 0.18 0.25 0.25 rg 45 693 Td 17 TL\n${page.map((s,j)=>`${j?'T* ':''}(${text(s)}) Tj`).join('\n')}\nET\nBT /F1 9 Tf 0.5 0.5 0.5 rg 45 40 Td (Prototipo PEDSAR - Documento de muestra - Pagina ${i+1}) Tj ET`;objects.push(`<< /Length ${stream.length} >>\nstream\n${stream}\nendstream`)});objects[1]=`<< /Type /Pages /Kids [${kids.join(' ')}] /Count ${kids.length} >>`;let out='%PDF-1.4\n',offsets=[0];objects.forEach((o,i)=>{offsets.push(out.length);out+=`${i+1} 0 obj\n${o}\nendobj\n`});const xref=out.length;out+=`xref\n0 ${objects.length+1}\n0000000000 65535 f \n`+offsets.slice(1).map(o=>String(o).padStart(10,'0')+' 00000 n \n').join('')+`trailer\n<< /Size ${objects.length+1} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF`;return new Blob([Uint8Array.from(out,c=>c.charCodeAt(0)&255)],{type:'application/pdf'})}

/* ZIP sin compresión para XLSX y certificados: todos los archivos siguen dentro de este HTML. */
const crcTable=Array.from({length:256},(_,n)=>{for(let k=0;k<8;k++)n=n&1?0xedb88320^(n>>>1):n>>>1;return n>>>0});
function crc32(bytes){let c=0xffffffff;for(const b of bytes)c=crcTable[(c^b)&255]^(c>>>8);return(c^0xffffffff)>>>0}
function zipFiles(files){const local=[],central=[],enc=new TextEncoder();let offset=0;const head=(len,vals)=>{const b=new Uint8Array(len),v=new DataView(b.buffer);for(const[o,n,w]of vals)w===2?v.setUint16(o,n,true):v.setUint32(o,n,true);return b};for(const f of files){const name=enc.encode(f.name),data=typeof f.data==='string'?enc.encode(f.data):f.data,crc=crc32(data),l=head(30,[[0,0x04034b50,4],[4,20,2],[6,0x800,2],[14,crc,4],[18,data.length,4],[22,data.length,4],[26,name.length,2]]);local.push(l,name,data);const c=head(46,[[0,0x02014b50,4],[4,20,2],[6,20,2],[8,0x800,2],[16,crc,4],[20,data.length,4],[24,data.length,4],[28,name.length,2],[42,offset,4]]);central.push(c,name);offset+=l.length+name.length+data.length}const size=central.reduce((s,c)=>s+c.length,0),end=head(22,[[0,0x06054b50,4],[8,files.length,2],[10,files.length,2],[12,size,4],[16,offset,4]]);return new Blob([...local,...central,end],{type:'application/zip'})}
function xlsx(name,rows){const xml=s=>String(s??'').replace(/[<>&"']/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;',"'":'&apos;'}[c])),col=i=>{let s='';for(i++;i;i=Math.floor((i-1)/26))s=String.fromCharCode(65+(i-1)%26)+s;return s},sheet=`<?xml version="1.0" encoding="UTF-8"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetData>${rows.map((r,i)=>`<row r="${i+1}">${r.map((v,j)=>typeof v==='number'?`<c r="${col(j)}${i+1}"><v>${v}</v></c>`:`<c r="${col(j)}${i+1}" t="inlineStr"><is><t xml:space="preserve">${xml(v)}</t></is></c>`).join('')}</row>`).join('')}</sheetData></worksheet>`;const files=[{name:'[Content_Types].xml',data:'<?xml version="1.0"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/></Types>'},{name:'_rels/.rels',data:'<?xml version="1.0"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>'},{name:'xl/workbook.xml',data:'<?xml version="1.0"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets><sheet name="PEDSAR" sheetId="1" r:id="rId1"/></sheets></workbook>'},{name:'xl/_rels/workbook.xml.rels',data:'<?xml version="1.0"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/></Relationships>'},{name:'xl/worksheets/sheet1.xml',data:sheet}];download(name,zipFiles(files))}

async function certificateZIP(){const list=selectedCertificates();if(!list.length){toast('No hay certificados con los filtros seleccionados.');return}const files=[];for(const c of list){const blob=pdfBlob('Certificado de muestra',['SIN VALIDEZ ACADEMICA',studentName(),c.title,c.hours+' horas','Instructor: '+c.instructor,'Codigo: DEMO-PED-2026-'+String(c.id).padStart(4,'0'),'Fecha: 15/09/2026','Firma digital no implementada.']);files.push({name:'PEDSAR_certificado_'+c.id+'.pdf',data:new Uint8Array(await blob.arrayBuffer())})}download('PEDSAR_certificados_muestra.zip',zipFiles(files));toast('Certificados de muestra descargados en ZIP.')}
function importQuestionsModal(){openModal('Importar preguntas desde Excel',`<p class="muted text-sm">Exporta tu hoja de Excel como CSV UTF-8 con separador punto y coma. Columnas: pregunta; opción 1; opción 2; opción 3; respuesta (1–3); puntos; categoría.</p><div class="mt-4">${button('Descargar plantilla CSV',"csv('PEDSAR_plantilla_preguntas.csv',[['pregunta','opcion1','opcion2','opcion3','correcta','puntos','categoria'],['¿Qué hook gestiona el estado?','useState','useColor','usePage',1,10,'React']])",'secondary','download')}</div><form onsubmit="importQuestions(event)" class="mt-6"><label for="questionsFile">Archivo CSV exportado desde Excel</label><input type="file" id="questionsFile" accept=".csv,text/csv" required><button class="btn w-full mt-4">Validar e importar</button></form>`)}
async function importQuestions(e){e.preventDefault();const file=$('#questionsFile').files[0];if(!file||file.size>1024*1024||!/\.csv$/i.test(file.name)){toast('Usa un CSV de hasta 1 MB.');return}const text=(await file.text()).replace(/^\uFEFF/,''),rows=[];let row=[],cell='',quoted=false;for(let i=0;i<text.length;i++){const ch=text[i];if(ch==='"'){if(quoted&&text[i+1]==='"'){cell+='"';i++}else quoted=!quoted}else if(ch===';'&&!quoted){row.push(cell);cell=''}else if(ch==='\n'&&!quoted){row.push(cell.replace(/\r$/,''));rows.push(row);row=[];cell=''}else cell+=ch}if(cell||row.length){row.push(cell.replace(/\r$/,''));rows.push(row)}if(quoted){toast('CSV inválido: revisa las comillas.');return}const data=rows.slice(1).filter(r=>r.some(v=>v.trim())),valid=data.every(r=>r.length===7&&r.slice(0,4).every(Boolean)&&[1,2,3].includes(Number(r[4]))&&Number(r[5])>0);if(!valid||!data.length){toast('El archivo contiene filas inválidas. Revisa la plantilla.');return}db.questions.push(...data.map((r,i)=>({id:Date.now()+i,text:r[0],options:r.slice(1,4),correct:Number(r[4])-1,points:Number(r[5]),category:r[6]})));save();closeModal();render();toast(data.length+' preguntas importadas.')}
